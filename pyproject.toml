[project]
name = "lloom-client"
dynamic = ["version"]
description = "lloom client: CLI, library, durable maildir outbox, MCP proxy, optional local embedding — puts an agent on the loom"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dexloom" }]
keywords = ["agents", "ai", "llm", "mcp", "messaging", "multi-agent", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "mcp>=2.0",
]

[project.optional-dependencies]
# Embedding runs on the hub by default: a bare install carries NO torch and
# NO model weights. Opt in to client-side (local) embedding only for
# deployments that pin it, with LLOOM_EMBED_BACKEND=local and the SAME model
# the hub embeds with.
local-embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/dexloom/lloom"
Repository = "https://github.com/dexloom/lloom"
Issues = "https://github.com/dexloom/lloom/issues"
Changelog = "https://github.com/dexloom/lloom/releases"

[project.scripts]
lloom = "lloom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version lives in exactly one place: the package's __init__.py.
[tool.hatch.version]
path = "src/lloom/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lloom"]

# The sdist is an explicit ALLOWLIST, not "everything git does not ignore":
# a stray file in client/ (a scratch config.json holding api_key+password,
# a dumped log, a db) must never be able to ride along into a PyPI upload.
[tool.hatch.build.targets.sdist]
only-include = ["src/lloom", "tests", "pyproject.toml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_embedder: tests requiring the real sentence-transformers embedding model",
]

[tool.ruff]
line-length = 100
target-version = "py312"
lint.ignore = ["BLE001"]
